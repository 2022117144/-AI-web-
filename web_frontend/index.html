<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>万象AI V7.5</title>
<style>
:root{--bg:#1e1e1e;--bg2:#252526;--bg3:#2d2d30;--text:#e0e0e0;--text2:#999;--border:#454545}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
body{background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
.title-bar{display:flex;align-items:center;height:30px;background:var(--bg3);padding:0 10px;flex-shrink:0}
.title-bar .icon{width:20px;height:20px;background:#007acc;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-right:6px}
.title-bar .title{font-size:12px;color:var(--text)}.title-bar .title span{color:#ff6b6b;margin-left:6px;font-size:11px}
.title-bar .spacer{flex:1}
.title-bar .win-btn{width:34px;height:26px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:12px}
.wx-main{display:flex;flex:1;overflow:hidden}
.wx-sidebar{width:180px;min-width:180px;background:var(--bg3);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:4px;overflow-y:auto;flex-shrink:0}
.wx-nav-btn{display:flex;align-items:center;gap:6px;padding:10px 12px;border:none;background:transparent;color:var(--text2);font-size:12px;cursor:pointer;border-radius:6px;width:100%;margin:1px 0;font-weight:bold;flex-shrink:0}
.wx-nav-btn:hover{background:var(--bg2);color:var(--text)}
.wx-nav-btn.active{background:rgba(0,122,204,0.15);color:#007acc;border-left:3px solid #007acc}
.wx-nav-btn .icon{font-size:13px;width:18px;text-align:center}
.wx-nav-sep{flex:1;min-height:8px}
.wx-nav-bottom{border-top:1px solid var(--border);padding-top:4px;margin-top:4px}
.wx-nav-bottom .wx-nav-btn{font-weight:normal;font-size:12px;padding:8px 12px;border:1px solid transparent;border-radius:6px;justify-content:center}
.wx-nav-bottom .wx-nav-btn:hover{border-color:#007acc}
.wx-content{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.wx-page{display:none;flex:1;min-height:0}
.wx-page.active{display:flex;flex-direction:column}
.wx-page.iframe-page{padding:0}
.zc-iframe{flex:1;border:none;width:100%}
.sp{display:none}.sp.active{display:block}
.tb{display:flex;gap:2px;border-bottom:1px solid var(--border);padding-bottom:6px;flex-shrink:0}
.tb-btn{padding:5px 14px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:12px;border-radius:4px 4px 0 0}
.tb-btn:hover{color:var(--text)}
.tb-btn.active{color:#007acc;background:rgba(0,122,204,0.1)}
</style>
</head>
<body>
<div class="app">
  <div class="title-bar">
    <div class="icon">🪄</div><div class="title">万象AI V7.5</div>
    <div class="spacer"></div>
    <button class="win-btn">一</button><button class="win-btn">口</button><button class="win-btn close">✕</button>
  </div>
  <div class="wx-main">
    <div class="wx-sidebar">
      <button class="wx-nav-btn active" data-wx="novel"><span class="icon">📝</span> 小说创作</button>
      <button class="wx-nav-btn" data-wx="batch"><span class="icon">🤖</span> 批量挂机</button>
      <button class="wx-nav-btn" data-wx="tools"><span class="icon">🛠️</span> 创作工具</button>
      <button class="wx-nav-btn" data-wx="copy"><span class="icon">📝</span> 文案</button>
      <button class="wx-nav-btn" data-wx="shots"><span class="icon">🎬</span> 分镜</button>
            <button class="wx-nav-btn" data-wx="storyboard"><span class="icon">📋</span> 分镜表</button>
            <button class="wx-nav-btn" data-wx="pipeline"><span class="icon">⚙️</span> 流水线</button>
      <button class="wx-nav-btn" data-wx="aitools"><span class="icon">📦</span> 资源管理</button>
      <div class="wx-nav-sep"></div>
      <div class="wx-nav-bottom">
        <button class="wx-nav-btn" data-wx="settings"><span class="icon">⚙️</span> 设置</button>
        <button class="wx-nav-btn" data-wx="theme"><span class="icon">🎨</span> 切换主题</button>
        <button class="wx-nav-btn" data-wx="logs"><span class="icon">📋</span> 运行日志</button>
      </div>
    </div>
    <div class="wx-content">
      <!-- 小说创作 -->
      <div class="wx-page active" id="wx-novel">
        <div style="padding:16px;flex:1;display:flex;flex-direction:column;min-height:0">
          <div class="tb"><button class="tb-btn active" onclick="switchNovelTab('outline')">📋 大纲</button><button class="tb-btn" onclick="switchNovelTab('volumes')">📚 卷</button><button class="tb-btn" onclick="switchNovelTab('content')">📝 正文</button></div>
          <div style="flex:1;display:flex;min-height:0;margin-top:8px;gap:12px">
            <div style="width:200px;min-width:200px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:10px;overflow-y:auto;flex-shrink:0">
              <div style="font-size:12px;color:var(--text2);margin-bottom:6px">📁 项目</div>
              <div id="novelProjects" style="font-size:12px;color:var(--text2)">暂无项目</div>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;min-height:0">
              <div class="sp active" id="novel-outline">
                <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">
                  <input id="novelTopic" placeholder="输入小说主题或设定..." style="flex:1;min-width:200px;padding:6px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px">
                  <button class="wx-btn" onclick="genOutline()" style="background:#007acc;color:#fff;border-color:#007acc;padding:6px 14px">生成大纲</button>
                  <button class="wx-btn" onclick="genChapterOutline()" style="padding:6px 14px">生成章纲</button>
                  <button class="wx-btn" onclick="genChapterContent()" style="padding:6px 14px">生成正文</button>
                </div>
                <textarea id="novelOutline" style="width:100%;flex:1;min-height:200px;padding:10px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px;resize:vertical" placeholder="AI生成的大纲将显示在这里..."></textarea>
              </div>
              <div class="sp" id="novel-volumes" style="font-size:12px;color:var(--text2);padding:20px;text-align:center">卷列表功能开发中</div>
              <div class="sp" id="novel-content" style="font-size:12px;color:var(--text2);padding:20px;text-align:center">正文编辑功能开发中</div>
            </div>
          </div>
        </div>
      </div>
      <!-- 批量挂机 -->
      <div class="wx-page" id="wx-batch">
        <div style="padding:12px 16px;flex:1;display:flex;flex-direction:column;min-height:0">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-shrink:0">
            <span style="font-size:14px;color:var(--text);font-weight:600">📂 项目</span>
            <button class="wx-btn" onclick="newProject()" style="background:#007acc;color:#fff;border:none;padding:5px 12px;border-radius:4px;font-size:12px;cursor:pointer;white-space:nowrap">＋ 新建项目</button>
                        <label class="wx-btn" style="display:flex;align-items:center;gap:4px;cursor:pointer;padding:5px 10px;font-size:12px;margin-left:4px"><input type="checkbox" id="autoName" style="accent-color:#007acc;width:13px;height:13px;cursor:pointer"> 自动命名</label>
                        <label class="wx-btn" style="display:flex;align-items:center;gap:4px;cursor:pointer;padding:5px 10px;font-size:12px;margin-left:4px"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()" style="accent-color:#007acc;width:13px;height:13px;cursor:pointer"> 全选</label>
            <button class="wx-btn" onclick="batchDelete()" style="color:#e74c3c;border-color:var(--border);padding:5px 12px;font-size:12px;white-space:nowrap">批量删除</button>
          </div>
          <div id="batchProjectList" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:1px">
            <div style="text-align:center;padding:40px;color:var(--text2);font-size:13px">暂无项目，点击「新建项目」创建</div>
          </div>
        </div>
      </div>
      <!-- 创作工具 -->
      <div class="wx-page" id="wx-tools">
        <div style="padding:16px;flex:1;display:flex;flex-direction:column;min-height:0">
          <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:12px">🛠️ 创作工具</div>
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
            <button class="wx-btn" onclick="setToolMode('general')" style="background:#f39c12;border-color:#f39c12;color:#fff;padding:6px 16px;font-weight:bold">通用推理模式</button>
            <button class="wx-btn" onclick="setToolMode('director')" style="background:#e74c3c;border-color:#e74c3c;color:#fff;padding:6px 16px;font-weight:bold">开启导演模式</button>
            <select id="toolScript" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px;height:32px"><option>预设指令</option><option>无预设指令</option></select>
            <input id="toolVideoUrl" placeholder="输入网络视频地址,支持国内外各大主流平台" style="flex:1;min-width:200px;padding:6px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px;height:32px">
            <button class="wx-btn" onclick="toolAction('downloadVideo')" style="padding:6px 12px;height:32px;background:#007acc;color:#fff;border-color:#007acc">下载网络视频</button>
            <button class="wx-btn" onclick="toolAction('openFolder')" style="padding:6px 12px;height:32px">打开辅助文件夹</button>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <input id="toolAudioFile" placeholder="选择需要提取字幕的音频或视频, 最长支持30分钟" style="flex:1;min-width:200px;padding:6px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px;height:32px">
            <button class="wx-btn" onclick="toolAction('selectAudio')" style="padding:6px 12px;height:32px">选择音频文件</button>
            <button class="wx-btn" onclick="toolAction('extractSubtitle')" style="padding:6px 12px;height:32px;background:#007acc;color:#fff;border-color:#007acc">提取音频字幕</button>
          </div>
          <div id="toolOutput" style="flex:1;margin-top:10px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:12px;color:var(--text2);overflow-y:auto;min-height:100px">操作结果将显示在这里</div>
        </div>
      </div>
      <!-- 文案/分镜/流水线/AI工具箱 - iframe -->
            <div class="wx-page iframe-page" id="wx-copy">
              <div class="proj-select-bar"><span class="ps-label">📁 项目</span><select class="ps-select" id="psCopy" onchange="onPsChange('copy',this.value)"><option value="">— 选择项目 —</option></select></div>
              <iframe class="zc-iframe" src="/zc/?tab=script&v=2"></iframe>
            </div>
            <div class="wx-page iframe-page" id="wx-shots">
                          <div class="proj-select-bar"><span class="ps-label">📁 项目</span><select class="ps-select" id="psShots" onchange="onPsChange('shots',this.value)"><option value="">— 选择项目 —</option></select></div>
                          <iframe class="zc-iframe" src="/zc/?tab=shots&v=2"></iframe>
                        </div>
                        <!-- 分镜表 -->
                                                <div class="wx-page" id="wx-storyboard">
                                                  <div class="proj-select-bar" style="padding:6px 14px;margin-bottom:4px"><span class="ps-label">📁 项目</span><select class="ps-select" id="psStoryboard" onchange="onPsChange('storyboard',this.value)"><option value="">— 选择项目 —</option></select></div>
                                                  <div style="display:flex;flex:1;min-height:0;overflow:hidden">
                            <div class="sb-main" id="sbMain">
                              <div class="sb-toolbar">
                                <span class="sb-title"></span>
                                <button class="wx-btn" onclick="sbAnalyzeScript()" style="background:#007acc;color:#fff;border-color:#007acc;padding:4px 12px">🔍 分析文案生成</button>
                                                                <button class="wx-btn" onclick="sbBatchGenFrames()" style="background:#007acc;color:#fff;border-color:#007acc;padding:4px 12px">🖼 批量生成所有图片</button>
                                                                <button class="wx-btn" onclick="sbCancelBatch()" style="color:#e74c3c;border-color:#e74c3c;padding:4px 12px">⏹ 暂停</button>
                                                                <button class="wx-btn" onclick="sbBatchGenVideos()" style="background:#007acc;color:#fff;border-color:#007acc;padding:4px 12px">🎬 一键生成视频</button>
                                                                <div style="flex:1"></div>
                                                                <span class="sb-count" id="sbCount">0 个镜头</span>
                              </div>
                              <div class="sb-table-wrap">
                                <table class="sb-table" id="sbTable">
                                  <thead>
                                    <tr>
                                      <th class="sb-col-idx" style="text-align:center">序号</th>
                                      <th class="sb-col-script" style="text-align:center">剧本</th>
                                      <th class="sb-col-asset" style="text-align:center">出场人物</th>
                                      <th class="sb-col-asset" style="text-align:center">场景</th>
                                      <th class="sb-col-asset" style="text-align:center">道具</th>
                                      <th class="sb-col-action" style="text-align:center">配音</th>
                                                                <th class="sb-col-frame" style="text-align:center">首帧</th>
                                                                <th class="sb-col-frame" style="text-align:center">尾帧</th>
                                                                <th class="sb-col-action" style="text-align:center">视频</th>
                                    </tr>
                                  </thead>
                                  <tbody id="sbBody">
                                  </tbody>
                                </table>
                              </div>
                            </div>
                                                      </div>
                                                    </div>
                                                    <div class="wx-page iframe-page" id="wx-pipeline">
              <div class="proj-select-bar"><span class="ps-label">📁 项目</span><select class="ps-select" id="psPipeline" onchange="onPsChange('pipeline',this.value)"><option value="">— 选择项目 —</option></select></div>
              <iframe class="zc-iframe" src="/zc/?tab=pipeline&v=2"></iframe>
            </div>
            <div class="wx-page iframe-page" id="wx-aitools"><iframe class="zc-iframe" src="/zc/?tab=aitools&v=2"></iframe></div>
                  <!-- 设置 -->
                  <div class="wx-page iframe-page" id="wx-settings"><iframe class="zc-iframe" src="/zc/?tab=settings&v=2"></iframe></div>
      <!-- 切换主题 -->
      <div class="wx-page" id="wx-theme">
        <div style="padding:20px;display:flex;flex-direction:column;gap:16px;max-width:500px">
          <div style="font-size:16px;font-weight:600;color:var(--text)">🎨 切换主题</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="theme-card" onclick="setTheme('dark')" style="background:var(--bg);border:2px solid #007acc;border-radius:8px;padding:20px;text-align:center;cursor:pointer">
              <div style="font-size:32px;margin-bottom:8px">🌙</div>
              <div style="font-size:13px;color:var(--text);font-weight:600">深色主题</div>
              <div style="font-size:11px;color:var(--text2);margin-top:4px">当前使用中</div>
            </div>
            <div class="theme-card" onclick="setTheme('light')" style="background:#f5f5f5;border:2px solid transparent;border-radius:8px;padding:20px;text-align:center;cursor:pointer">
              <div style="font-size:32px;margin-bottom:8px">☀️</div>
              <div style="font-size:13px;color:#333;font-weight:600">浅色主题</div>
              <div style="font-size:11px;color:var(--text2);margin-top:4px">点击切换</div>
            </div>
          </div>
          <div id="themeStatus" style="font-size:12px;color:var(--text2)"></div>
        </div>
      </div>
      <!-- 运行日志 -->
      <div class="wx-page" id="wx-logs">
        <div style="padding:20px;flex:1;display:flex;flex-direction:column">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-shrink:0">
            <span style="font-size:16px;font-weight:600;color:var(--text)">📋 运行日志</span>
            <button class="wx-btn" onclick="clearLogs()" style="color:#e74c3c;border-color:var(--border);padding:4px 12px;font-size:12px">清空日志</button>
            <button class="wx-btn" onclick="refreshLogs()" style="padding:4px 12px;font-size:12px">🔄 刷新</button>
          </div>
          <div id="logContent" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:12px;font-family:monospace;font-size:11px;color:var(--text);overflow-y:auto;white-space:pre-wrap;line-height:1.5">
            <div style="color:var(--text2);text-align:center;padding:40px">加载日志中...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ====== 导航切换 ======
document.querySelectorAll('.wx-nav-btn[data-wx]').forEach(function(b){
b.addEventListener('click',function(){
document.querySelectorAll('.wx-nav-btn').forEach(function(x){x.classList.remove('active')});
this.classList.add('active');
document.querySelectorAll('.wx-page').forEach(function(x){x.classList.remove('active')});
var t=document.getElementById('wx-'+this.dataset.wx);
if(t)t.classList.add('active');
if (this.dataset.wx === 'batch') loadProjects();
if (this.dataset.wx === 'logs') refreshLogs();
if (this.dataset.wx === 'storyboard') { var pid = localStorage.getItem('wx_selected_project') || ''; sbLoadFromProject(pid); }
saveCurrentPage();
})});
restoreLastPage();

// ====== 页面持久化 ======
function saveCurrentPage() {
  var a = document.querySelector('.wx-nav-btn.active');
  if (a) localStorage.setItem('wx_last_page', a.dataset.wx);
}
// 恢复上次页面
function restoreLastPage() {
  // 恢复主题
  var savedTheme = localStorage.getItem('wx_theme');
  if (savedTheme === 'light') {
    document.documentElement.style.setProperty('--bg', '#f0ebe3');
    document.documentElement.style.setProperty('--bg2', '#faf6f0');
    document.documentElement.style.setProperty('--bg3', '#e8e2d8');
    document.documentElement.style.setProperty('--text', '#3d3d3d');
    document.documentElement.style.setProperty('--text2', '#888888');
    document.documentElement.style.setProperty('--border', '#d5cfc5');
    // 更新主题卡片样式和状态文字
    var cards = document.querySelectorAll('.theme-card');
    if (cards.length > 0) {
      cards.forEach(function(c){c.style.borderColor='transparent'});
      cards[1].style.borderColor='#007acc';
      var labels = document.querySelectorAll('.theme-card div:last-child');
      if (labels.length >= 2) {
        labels[0].textContent = '点击切换';
        labels[1].textContent = '当前使用中';
      }
    }
  }
  // 恢复上次页面
  var s = localStorage.getItem('wx_last_page');
  if (s) { var b = document.querySelector('[data-wx="'+s+'"]'); if (b) b.click(); }
}

// ====== 小说创作 ======
function switchNovelTab(tab) {
  document.querySelectorAll('.tb-btn').forEach(function(b){b.classList.remove('active')});
  document.querySelectorAll('.tb-btn').forEach(function(b){if(b.textContent.includes({outline:'大纲',volumes:'卷',content:'正文'}[tab]))b.classList.add('active')});
  document.querySelectorAll('#wx-novel .sp').forEach(function(p){p.classList.remove('active')});
  var t = document.getElementById('novel-'+tab);
  if (t) t.classList.add('active');
}
async function genOutline() {
  var t = document.getElementById('novelTopic').value.trim();
  var o = document.getElementById('novelOutline');
  if (!t) { o.value = '请输入小说主题'; return; }
  o.value = 'AI正在生成大纲...';
  try {
    var r = await fetch('/api/llm/chat', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:'请为以下主题生成小说大纲：\n'+t})});
    var d = await r.json();
    o.value = d.reply || '生成失败';
  } catch(e) { o.value = '请求失败: '+e.message; }
}
async function genChapterOutline() {
  var o = document.getElementById('novelOutline');
  o.value = '章纲生成功能待接入';
}
async function genChapterContent() {
  var o = document.getElementById('novelOutline');
  o.value = '正文生成功能待接入';
}

// ====== 创作工具 ======
function setToolMode(mode) {
  var btns = document.querySelectorAll('#wx-tools .wx-btn');
  btns.forEach(function(b){
    if (b.textContent.includes('通用推理')) b.style.background = mode==='general' ? '#f39c12' : '#454545';
    if (b.textContent.includes('开启导演')) b.style.background = mode==='director' ? '#e74c3c' : '#454545';
  });
  document.getElementById('toolOutput').textContent = '已切换到' + (mode==='general'?'通用推理模式':'导演模式');
}
function toolAction(action) {
  var msgs = {downloadVideo:'正在下载视频...', openFolder:'正在打开辅助文件夹...', selectAudio:'已选择音频文件', extractSubtitle:'正在提取字幕...'};
  document.getElementById('toolOutput').textContent = msgs[action] || '执行中...';
}

// ====== 切换主题 ======
function setTheme(theme) {
  var cards = document.querySelectorAll('.theme-card');
  cards.forEach(function(c){c.style.borderColor='transparent'});
  localStorage.setItem('wx_theme', theme);
  // 更新状态文字
  var labels = document.querySelectorAll('.theme-card div:last-child');
  if (labels.length >= 2) {
    labels[0].textContent = theme === 'dark' ? '当前使用中' : '点击切换';
    labels[1].textContent = theme === 'light' ? '当前使用中' : '点击切换';
  }
  if (theme === 'dark') {

const STEP_LABELS = ['🎨风格','📝文案','🎬SRT+分镜','🖼️图片','🎥视频','✂️合成','🎵导出'];
const API_BASE = 'http://localhost:8765';

async function loadProjects() {
  var el = document.getElementById('batchProjectList');
  try {
    var r = await fetch(API_BASE + '/api/projects');
    var data = await r.json();
    var projs = Object.values(data);
    if (!projs.length) { el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2);font-size:13px">暂无项目，点击「新建项目」创建</div>'; return; }
    var rr = await fetch(API_BASE + '/api/pipeline/runs');
    var allRuns = await rr.json();
    var runsByProj = {};
    (Array.isArray(allRuns) ? allRuns : []).forEach(function(run){ var pid = run.project_id || ''; if (!runsByProj[pid]) runsByProj[pid] = []; runsByProj[pid].push(run); });
    el.innerHTML = projs.map(function(p){
      var runs = runsByProj[p.project_id] || [];
      var latest = runs.length > 0 ? runs[0] : null;
      var runsHtml = latest ? (function(r){
        var st = r.status || 'unknown';
        var icon = st === 'completed' ? '✅' : st === 'error' ? '❌' : st === 'cancelled' ? '⏹' : '⏳';
        var color = st === 'completed' ? '#2ecc71' : st === 'error' ? '#e74c3c' : st === 'cancelled' ? '#f39c12' : '#666';
        var steps = r.steps || [];
        var dots = steps.map(function(s,i){
                  var cls = s.status === 'completed' ? 'done' : s.status === 'error' ? 'fail' : s.status === 'running' ? 'running' : 'skip';
                  return '<div class="step-dot '+cls+'" title="'+STEP_LABELS[i]+': '+(s.status||'待执行')+'">'+(i+1)+'</div>';
                }).join('');
        var idShort = (r.run_id || r.id || '').substring(0, 8);
        return '<div class="run-mini"><span class="run-mini-status" style="color:'+color+'">'+icon+' '+st+'</span><span class="run-mini-id">'+idShort+'…</span><div style="display:flex;gap:2px">'+dots+'</div></div>';
      })(latest) : '<span style="font-size:11px;color:var(--text2)">暂无运行记录</span>';
      return '<div class="proj-bar"><input type="checkbox" class="proj-cb" value="'+p.project_id+'" style="accent-color:#007acc;width:14px;height:14px;cursor:pointer;flex-shrink:0"><span class="proj-name" onclick="showRenameModal(\''+p.project_id+'\',\''+(p.project_name||'未命名').replace(/'/g,'')+'\')" title="点击重命名" style="cursor:pointer">📁 '+(p.project_name||'未命名')+'</span><div class="proj-runs">'+runsHtml+'</div><button class="wx-btn" onclick="event.stopPropagation();deleteProject(\''+p.project_id+'\',\''+(p.project_name||'未命名').replace(/'/g,'')+'\')" style="color:var(--text);border-color:var(--border);padding:2px 8px;font-size:13px;flex-shrink:0;border-radius:3px;line-height:1" title="删除">🗑</button></div>';
    }).join('');
  } catch(e) { el.innerHTML = '<div style="text-align:center;padding:20px;color:#e74c3c">加载失败: '+e.message+'</div>'; }
}

async function newProject() {
  try {
    var name = '未命名';
    if (document.getElementById('autoName').checked) {
      // 获取当前最大数字项目名
      var r = await fetch(API_BASE + '/api/projects');
      var list = await r.json();
      var maxNum = 0;
      list.forEach(function(p){
        var n = parseInt(p.project_name, 10);
        if (!isNaN(n) && n > maxNum) maxNum = n;
      });
      name = String(maxNum + 1);
    }
    await fetch(API_BASE + '/api/projects', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_name:name})});
    loadProjects();
  } catch(e) { alert('创建失败: '+e.message); }
}

function toggleSelectAll() {
  var checked = document.getElementById('selectAll').checked;
  document.querySelectorAll('.proj-cb').forEach(function(cb){cb.checked = checked;});
}

async function batchDelete() {
  var cbs = document.querySelectorAll('.proj-cb:checked');
  var ids = [];
  cbs.forEach(function(cb){if(cb.value)ids.push(cb.value);});
  if (ids.length === 0) { alert('请先勾选要删除的项目'); return; }
  if (!confirm('确定要删除选中的 '+ids.length+' 个项目吗？此操作不可撤销。')) return;
  var done = 0, failed = 0;
  for (var i = 0; i < ids.length; i++) {
    try {
      var r = await fetch(API_BASE + '/api/projects/' + encodeURIComponent(ids[i]), { method: 'DELETE' });
      if (r.ok) done++; else failed++;
    } catch(e) { failed++; }
  }
  if (failed > 0) alert('删除了 '+done+' 个，'+failed+' 个删除失败');
  loadProjects();
}

function deleteProject(id, name) {
  if (!id) return;
  if (!confirm('确定要删除项目「'+name+'」吗？此操作不可撤销。')) return;
  fetch(API_BASE + '/api/projects/' + encodeURIComponent(id), { method: 'DELETE' })
  .then(function(r){if(r.ok)loadProjects();else alert('删除失败');})
  .catch(function(e){alert('删除失败: '+e.message);});
}

var sbShots = [];

function sbLoadFromProject(projectId) {
  if (!projectId) return;
  sbCurrentProject = projectId;
  fetch(API_BASE + '/api/projects/' + encodeURIComponent(projectId) + '/content')
    .then(function(r){return r.json()})
    .then(function(data){
      if (data && data.shots && data.shots.length > 0) {
        sbShots = data.shots.map(function(s, i){
          var sd = (data.shot_data || {})[String(i)] || {};
          // 优先用本地路径（xxxLocal），没有才用 CDN URL
          var firstFrame = sd.firstFrameLocal ? '/api/project-files/' + sd.firstFrameLocal.replace(/\\/g, '/') : (sd.firstFrame || '');
          var lastFrame = sd.lastFrameLocal ? '/api/project-files/' + sd.lastFrameLocal.replace(/\\/g, '/') : (sd.lastFrame || '');
          var video = sd.videoLocal ? '/api/project-files/' + sd.videoLocal.replace(/\\/g, '/') : (sd.video || '');
          return {
            script: s.voiceover || '',
            prompt: s.prompt || '',
            character: sd.character || '',
            scene: sd.scene || '',
            prop: sd.prop || '',
            firstFrame: firstFrame,
            lastFrame: lastFrame,
            video: video,
          };
        });
        sbGenStatus = {};
      } else {
        sbShots = [];
        sbGenStatus = {};
      }
      sbRender();
    })
    .catch(function(){});
}

var sbGenStatus = {};
var sbCurrentProject = localStorage.getItem('wx_selected_project') || '';

function saveSbData() {
  // 保存到后端 API
  if (!sbCurrentProject) return;
  var shots = sbShots.map(function(s){
    return {
      index: 0,  // 占位，后端会重新编号
      scene: s.prompt || '',
      prompt: s.prompt || '',
      voiceover: s.script || '',
      duration: 3,
      first_frame_prompt: s.firstFramePrompt || '',
      last_frame_prompt: s.lastFramePrompt || '',
    };
  });
  // 每行给一个 index
  shots.forEach(function(s, i){ s.index = i + 1; });
  // 保存 shot_data（图片、视频等非文本字段）
    var shotData = {};
    sbShots.forEach(function(s, i){
      var key = String(i);
      var entry = {};
      if (s.character) entry.character = s.character;
      if (s.scene) entry.scene = s.scene;
      if (s.prop) entry.prop = s.prop;
      // 如果是 /api/project-files/ 开头的本地路径，存 xxxLocal（绝对路径）
      // 否则存原始 URL
      if (s.firstFrame) {
        if (s.firstFrame.startsWith('/api/project-files/')) {
          entry.firstFrameLocal = s.firstFrame.replace('/api/project-files/', '');
          entry.firstFrame = s.firstFrame;
        } else {
          entry.firstFrame = s.firstFrame;
        }
      }
      if (s.lastFrame) {
        if (s.lastFrame.startsWith('/api/project-files/')) {
          entry.lastFrameLocal = s.lastFrame.replace('/api/project-files/', '');
          entry.lastFrame = s.lastFrame;
        } else {
          entry.lastFrame = s.lastFrame;
        }
      }
      if (s.video) {
        if (s.video.startsWith('/api/project-files/')) {
          entry.videoLocal = s.video.replace('/api/project-files/', '');
          entry.video = s.video;
        } else {
          entry.video = s.video;
        }
      }
      if (Object.keys(entry).length > 0) shotData[key] = entry;
    });
  fetch(API_BASE + '/api/projects/' + encodeURIComponent(sbCurrentProject) + '/content', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({shots: shots, shot_data: shotData})
  }).catch(function(){});
}

function loadSbData() {
  try {
    var key = 'sb_data_' + (sbCurrentProject || '_default');
    var data = JSON.parse(localStorage.getItem(key) || 'null');
    if (data && data.shots) { sbShots = data.shots; sbGenStatus = data.status || {}; }
    
  } catch(e) {}
}

function sbAddShot() {
  sbShots.push({script:'', prompt:'', character:'', scene:'', prop:''});
  sbRender();
  // 滚动到底部
  var wrap = document.querySelector('.sb-table-wrap');
  if (wrap) wrap.scrollTop = wrap.scrollHeight;
}

function sbDeleteShot(i) {
  sbShots.splice(i, 1);
  sbRender();
}

function sbMoveUp(i) {
  if (i <= 0) return;
  var tmp = sbShots[i];
  sbShots[i] = sbShots[i-1];
  sbShots[i-1] = tmp;
  sbRender();
}

function sbMoveDown(i) {
  if (i >= sbShots.length - 1) return;
  var tmp = sbShots[i];
  sbShots[i] = sbShots[i+1];
  sbShots[i+1] = tmp;
  sbRender();
}

function sbPickAsset(i, type) {
  var apiPath = type === 'character' ? '/api/characters' : type === 'scene' ? '/api/scenes' : '/api/props';
  var pid = sbCurrentProject;
  if (!pid) { alert('请先选择项目'); return; }
  fetch(API_BASE + apiPath + '?project_id=' + encodeURIComponent(pid))
    .then(function(r){ return r.json(); })
    .then(function(list){
      if (!list || list.length === 0) { alert('暂无可用' + (type === 'character' ? '角色' : type === 'scene' ? '场景' : '道具') + '，请先在设置页面添加'); return; }
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center';
      overlay.onclick = function(){ document.body.removeChild(overlay); };
      var box = document.createElement('div');
      box.style.cssText = 'background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;max-width:360px;width:90%;max-height:80vh;overflow-y:auto';
      box.onclick = function(e){ e.stopPropagation(); };
      var title = document.createElement('div');
      title.style.cssText = 'font-size:14px;font-weight:600;color:var(--text);margin-bottom:10px';
      title.textContent = '选择' + (type === 'character' ? '角色' : type === 'scene' ? '场景' : '道具');
      box.appendChild(title);
      list.forEach(function(item){
        var btn = document.createElement('div');
        btn.style.cssText = 'padding:8px 12px;border:1px solid var(--border);border-radius:4px;margin-bottom:4px;cursor:pointer;font-size:12px;color:var(--text);background:var(--bg)';
        btn.onmouseover = function(){ btn.style.borderColor = '#007acc'; };
        btn.onmouseout = function(){ btn.style.borderColor = 'var(--border)'; };
        btn.textContent = item.name || '未命名';
        btn.onclick = function(){
          sbShots[i][type] = item.name;
          sbRender();
          saveSbData();
          document.body.removeChild(overlay);
        };
        box.appendChild(btn);
      });
      var cancelBtn = document.createElement('div');
      cancelBtn.style.cssText = 'padding:8px 12px;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:12px;color:var(--text2);text-align:center;margin-top:4px';
      cancelBtn.textContent = '取消';
      cancelBtn.onclick = function(){ document.body.removeChild(overlay); };
      box.appendChild(cancelBtn);
      overlay.appendChild(box);
      document.body.appendChild(overlay);
    })
    .catch(function(){ alert('加载列表失败'); });
}

function sbGenVideo(i) {
  var shot = sbShots[i];
  if (!shot || !shot.prompt) { alert('请先填写分镜的 PROMPT'); return; }
  sbGenStatus[i] = sbGenStatus[i] || {};
  sbGenStatus[i].video = 'loading';
  sbRender();
  var shots = [{
    index: i + 1,
    prompt: shot.prompt,
    voiceover: shot.script || '',
    first_frame: shot.firstFrame || '',
    last_frame: shot.lastFrame || '',
    duration: 10,
  }];
  fetch(API_BASE + '/api/storyboard/generate-video', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({shots: shots, shot_frames: {}, model: 'Pixverse-V6.0', ratio: '16:9', resolution: '360p', duration: 10})
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if (data.code === 200 && data.data && data.data.output && data.data.output.videos) {
      var v = data.data.output.videos[0];
      if (v && v.video_url) {
        sbShots[i].video = v.video_url;
        sbGenStatus[i].video = 'done';
        saveSbData();
      } else {
        sbGenStatus[i].video = 'error';
        alert('视频生成失败: ' + (v.error || '无返回 URL'));
      }
    } else {
      sbGenStatus[i].video = 'error';
      alert('视频生成失败: ' + (data.data ? data.data.error : '请求失败'));
    }
    sbRender();
  })
  .catch(function(err){
    sbGenStatus[i].video = 'error';
    sbRender();
    alert('视频生成请求失败: ' + err.message);
  });
}
function sbPlayVideo(url) {
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;display:flex;align-items:center;justify-content:center';
  overlay.onclick = function(){ document.body.removeChild(overlay); };
  var wrap = document.createElement('div');
  wrap.style.cssText = 'max-width:90vw;max-height:90vh;background:#000;border-radius:8px;overflow:hidden;box-shadow:0 4px 40px rgba(0,0,0,0.5)';
  wrap.onclick = function(e){ e.stopPropagation(); };
  var video = document.createElement('video');
  video.src = url;
  video.controls = true;
  video.autoplay = true;
  video.style.cssText = 'display:block;max-width:90vw;max-height:90vh';
  wrap.appendChild(video);
  overlay.appendChild(wrap);
  document.body.appendChild(overlay);
}
function sbBatchGen() { alert('批量生成功能待接入'); }
function sbImportScript() { alert('导入文案功能待接入'); }

function sbUploadFrame(i, type) {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      if (type === 'first') sbShots[i].firstFrame = ev.target.result;
      else sbShots[i].lastFrame = ev.target.result;
      sbRender();
      saveSbData();
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

// ====== 分镜表工具栏功能：转发到智创工具分镜 iframe ======
function _sbCallIframe(fnName, btnId) {
  var iframe = document.querySelector('#wx-shots iframe');
  if (iframe && iframe.contentWindow && iframe.contentWindow[fnName]) {
    // 显示加载状态
    var btn = document.querySelector('.sb-toolbar [onclick*="' + fnName + '"]');
    if (btn) { btn.disabled = true; var orig = btn.textContent; btn.textContent = '⏳'; btn.style.opacity = '0.6'; }
    iframe.contentWindow[fnName]();
    // 轮询 iframe 里对应按钮的状态，同步到分镜表按钮
    var poll = setInterval(function(){
      try {
        var ibtn = iframe.contentWindow.document.getElementById(
          fnName === 'analyzeScript' ? 'analyzeBtn' :
          fnName === 'batchGenFrames' ? 'batchGenBtn' :
          fnName === 'cancelBatchFrames' ? 'cancelBatchBtn' :
          fnName === 'batchGenVideos' ? 'batchVideoBtn' : ''
        );
        if (ibtn) {
          var btn2 = document.querySelector('.sb-toolbar [onclick*="' + fnName + '"]');
          if (btn2) {
            btn2.textContent = ibtn.textContent;
            btn2.disabled = ibtn.disabled;
            btn2.style.opacity = ibtn.disabled ? '0.6' : '1';
          }
          // 如果 iframe 按钮恢复就停止轮询
          if (!ibtn.disabled && ibtn.textContent.indexOf('⏳') === -1) {
            clearInterval(poll);
          }
        }
      } catch(e) {}
    }, 500);
  } else {
    alert('请先打开「分镜」页面再执行此操作');
  }
}
function sbAnalyzeScript() { _sbCallIframe('analyzeScript'); }
function sbBatchGenFrames() { _sbCallIframe('batchGenFrames'); }
function sbCancelBatch() { _sbCallIframe('cancelBatchFrames'); }
function sbBatchGenVideos() { _sbCallIframe('batchGenVideos'); }
